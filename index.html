      "@type": "Question",
      "name": "Do you only work on German cars?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "No. BMW, Audi and Mercedes are what we are known for and what the workshop is built around, but we take all makes and models for servicing, repair and alignment. If you are unsure whether your car suits us, ring and ask."
      }
    },
    {
      "@type": "Question",
      "name": "Will an independent service affect my manufacturer warranty?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "No. An independent garage can service a car inside its manufacturer warranty as long as the correct schedule, parts and fluids are used and the service record is completed. That is exactly how we service warranty cars."
      }
    },
    {
      "@type": "Question",
      "name": "Do you work on modified cars?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Yes, and a large part of the work is modified cars. Coilovers, spacers, aftermarket exhausts and non-standard geometry are normal here rather than a reason to hand the car back. We will also tell you honestly if something already fitted is not right for the car."
      }
    },
    {
      "@type": "Question",
      "name": "What is string alignment and why does it matter?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "The car is measured against strings squared to its own centreline, which is how a race car is set up. It reads camber, caster and toe accurately on a car that may sit nothing like factory height, which a quick laser check at a tyre place cannot do. It is the difference between a lowered car that steers well and one that tramlines and eats tyres."
      }
    },
    {
      "@type": "Question",
      "name": "Can you collect my car if it is not driveable?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Usually, yes. We offer roadside collection, so rather than arranging recovery yourself, ring and we will tell you what we can do."
      }
    },
    {
      "@type": "Question",
      "name": "Do I need an appointment?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "For anything beyond a quick look, yes. The workshop is open Monday to Friday, 9am to 6pm, and booking ahead means the right ramp and the right parts are ready when the car arrives."
      }
    },
    {
      "@type": "Question",
      "name": "Do you give a price before starting?",

        "@type": "Answer",
        "text": "Always. You get told what the car needs, what can wait and what it will cost before any work begins. If something turns up mid-job, you get a phone call rather than a surprise on the invoice."
      }
    }
