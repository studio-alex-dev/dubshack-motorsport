            "text": "Usually not. Most open pit lane track days accept a standard road car with a helmet, sound tyres and good brakes. A cage becomes relevant for competition, and once fitted it brings requirements of its own around seats, harnesses and helmets. We will tell you which side of that line you are on."

          "name": "Is a track car still usable on the road?",
